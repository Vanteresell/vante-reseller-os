<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTE Reseller OS</title>
<style>body{margin:0;background:#0b0b0b;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(920px,92%);text-align:center}.logo{letter-spacing:8px;font-weight:900;font-size:42px}.tag{color:#aaa;font-size:18px;margin:16px 0 34px}.card{background:#151515;border:1px solid #292929;border-radius:22px;padding:36px;max-width:520px;margin:auto}.price{font-size:44px;font-weight:900}.price span{font-size:16px;color:#999;font-weight:500}.btn{display:inline-block;border:0;background:#fff;color:#111;padding:15px 22px;border-radius:12px;font-weight:800;text-decoration:none;cursor:pointer;font-size:16px;margin-top:20px}.small{font-size:13px;color:#777;margin-top:20px;line-height:1.5}.error{color:#ff7777;margin-top:15px}.manage{background:#252525;color:#fff}</style></head>
<body><main class="wrap"><div class="logo">VANTE</div><div class="tag">Reseller OS — dein digitales Reselling-Dashboard.</div><section class="card"><div class="price">4,99 € <span>/ Monat</span></div><p>Produkte, Verkäufe, Ausgaben, Gewinn, Ziele und Analytics in einem Dashboard.</p><button class="btn" id="buy">Jetzt starten</button><button class="btn manage" id="manage">Abo verwalten</button><div class="small">Nach dem Kauf wirst du automatisch zu deinem VANTE Dashboard weitergeleitet. Wiederkehrende Zahlung monatlich. Kündigung über das Kundenportal.</div><div class="error" id="error"></div></section></main>
<script>
async function post(url){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Etwas ist schiefgelaufen.');return d}
document.getElementById('buy').onclick=async()=>{try{document.getElementById('error').textContent='';const d=await post('/.netlify/functions/create-checkout');location.href=d.url}catch(e){document.getElementById('error').textContent=e.message}};
document.getElementById('manage').onclick=async()=>{try{document.getElementById('error').textContent='';const d=await post('/.netlify/functions/customer-portal');location.href=d.url}catch(e){document.getElementById('error').textContent='Bitte zuerst ein aktives Abo abschließen.'}};
</script></body></html>
