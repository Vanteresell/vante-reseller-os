<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTE — Zahlung erfolgreich</title><style>body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}.box{max-width:520px;padding:36px}.logo{font-size:40px;font-weight:900;letter-spacing:8px}.ok{font-size:60px;margin:25px 0}.btn{display:inline-block;background:#fff;color:#111;padding:14px 20px;border-radius:10px;text-decoration:none;font-weight:800}</style></head><body><div class="box"><div class="logo">VANTE</div><div class="ok">✓</div><h1>Zahlung erfolgreich</h1><p id="status">Wir prüfen dein Abo und öffnen dein Dashboard…</p><a class="btn" href="/">Zurück</a></div><script>
(async()=>{const q=new URLSearchParams(location.search);const session=q.get('session_id');if(!session){document.getElementById('status').textContent='Keine Checkout-Session gefunden.';return}try{const r=await fetch('/.netlify/functions/verify-access?session_id='+encodeURIComponent(session));if(!r.ok)throw new Error();location.href='/app.html'}catch(e){document.getElementById('status').textContent='Die Zahlung wurde bestätigt, aber der Zugriff konnte noch nicht aktiviert werden. Bitte lade die Seite gleich noch einmal.'}})();
</script></body></html>
